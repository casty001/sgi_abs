<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SGI-ABS - Práctica</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

  <div class="sidebar">
    <h2>SGI - ABS</h2>
    <a href="/">📊 Dashboard</a>
    <a href="/notas.html">📚 Gestión de Notas</a>
    <a href="/practica.html" class="activo">💼 Etapa Práctica</a>
    <a href="/evidencias.html">🎓 Paz y Salvo</a>
  </div>

  <div class="main-content">
    <h1>Etapa Práctica</h1>
    
    <!-- SELECTOR DE ESTUDIANTES -->
    <div class="card" style="margin-bottom: 2rem; background: #e0e7ff; border-left: 5px solid #1e3a8a;">
      <label style="font-weight: bold; color: #1e3a8a;">Seleccione un Estudiante para gestionar su práctica:</label>
      <select id="selector-estudiante" style="margin-top: 10px; font-weight: bold; font-size: 1.1rem;">
        <option value="">Cargando estudiantes...</option>
      </select>
    </div>

    <!-- FORMULARIO (Oculto hasta elegir estudiante) -->
    <div class="grid" id="seccion-practica" style="display: none;">
      
      <div class="card">
        <h3>Inscribir a Etapa Práctica (RN-01)</h3>
        <p style="margin-bottom: 1rem; color: #666; font-size: 0.9rem;">El sistema bloqueará el registro si el estudiante tiene materias pendientes.</p>
        <form id="form-practica">
          <input type="hidden" id="id_estudiante_form">
          
          <label>Modalidad:</label>
          <select id="modalidad" required>
            <option value="Práctica">Práctica Laboral</option>
            <option value="Pasantía">Pasantía</option>
            <option value="Proyecto">Proyecto de Grado</option>
          </select>
          
          <label>Empresa o Entidad:</label>
          <input type="text" id="empresa" placeholder="Ej: Tech Solutions SAS" required>
          
          <button type="submit">Inscribir Práctica</button>
        </form>
      </div>

      <div class="card">
        <h3>Práctica Registrada</h3>
        <div id="info-practica" style="margin-top: 1rem;">
          <!-- Aquí se carga la info de la práctica -->
        </div>
      </div>
      
    </div>
  </div>

  <script src="/js/practica.js"></script>
</body>
</html>
